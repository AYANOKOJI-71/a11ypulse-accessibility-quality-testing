services:
  target:
    build:
      context: .
      dockerfile: apps/target/Dockerfile
    environment:
      PORT: 5300
    ports:
      - "5300:5300"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5300/demo-reviewed-baseline').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4920
      AUDIT_TARGET_BASE_URL: http://target:5300
      PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      target:
        condition: service_healthy
    ports:
      - "4920:4920"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:4920
    depends_on:
      api:
        condition: service_started
    ports:
      - "5202:5202"
